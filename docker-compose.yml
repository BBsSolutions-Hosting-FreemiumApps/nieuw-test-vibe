services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+psycopg2://motor:motor@db:5432/motor
      - MEDIA_DIR=/data/media
    volumes:
      - media_data:/data/media
    depends_on:
      - db
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=motor
      - POSTGRES_PASSWORD=motor
      - POSTGRES_DB=motor
    volumes:
      - pg_data:/var/lib/postgresql/data

volumes:
  media_data:
  pg_data:
