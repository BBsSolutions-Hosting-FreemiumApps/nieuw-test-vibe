services:
  - type: web
    name: content-motor
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: BASE_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: motor-db
          property: connectionString
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: MEDIA_DIR
        value: ./media

databases:
  - name: motor-db
    plan: free
